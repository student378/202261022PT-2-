<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>학생복지팀 운영사례</title>
<meta name="description" content="유한대학교 학생복지팀이 직접 운영하는 학생 서비스 4종(유한봇·웰니스스테이션·천원의 아침밥·천원매점) 운영사례 영상">
<meta property="og:title" content="학생복지팀 운영사례">
<meta property="og:description" content="유한봇 · 웰니스스테이션 · 천원의 아침밥 · 천원매점">
<meta property="og:image" content="poster.jpg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#16202c;--mut:#5b6b7c;--acc:#1668c9;--line:#d5dce5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#141d2e;--ink:#eef3fa;--mut:#9fb0c8;--acc:#4da3ff;--line:#26344d}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#141d2e;--ink:#eef3fa;--mut:#9fb0c8;--acc:#4da3ff;--line:#26344d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;padding:32px 16px 56px}
main{max-width:1040px;margin:0 auto}
.kicker{font-size:13px;font-weight:700;color:var(--acc);letter-spacing:1px}
h1{font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:-.5px;line-height:1.3;margin:6px 0 8px}
.lead{color:var(--mut)}
.player{margin:24px 0 16px;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 12px 40px rgba(0,0,0,.25)}
video{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#000}
.chapters{display:flex;flex-wrap:wrap;gap:8px}
.chapters button{font:inherit;font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chapters button span{color:var(--mut);font-weight:500;margin-right:6px;font-variant-numeric:tabular-nums}
.chapters button[aria-current="true"]{border-color:var(--acc);color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:28px}
.svc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.svc b{display:block;font-size:17px}
.svc small{color:var(--mut)}
footer{margin-top:32px;font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<main>
  <div class="kicker">유한대학교 학생복지팀 · 운영사례</div>
  <h1>학생복지팀이 직접 운영하는 학생 서비스 4종</h1>
  <p class="lead">수기 명부와 흩어진 안내를, 학생 휴대폰 하나로 옮긴 과정과 운영 성과를 3분 영상으로 정리했습니다.</p>

  <div class="player">
    <video id="v" src="motion.mp4" poster="poster.jpg" controls playsinline preload="metadata"></video>
  </div>

  <nav class="chapters" id="ch" aria-label="장면 바로가기"></nav>

  <section class="grid">
    <div class="svc"><b>🤖 유한봇</b><small>대학생활 안내 앱 + 챗봇</small></div>
    <div class="svc"><b>🏋️ 웰니스스테이션</b><small>시설 이용신청·승인</small></div>
    <div class="svc"><b>🍱 천원의 아침밥</b><small>신청·현장 승인</small></div>
    <div class="svc"><b>🏪 천원매점</b><small>신청·재고관리</small></div>
  </section>

  <footer>운영 수치는 ’26.10.15. 유한봇 로그 대시보드와 각 서비스 관리자 화면 기준입니다. 영상 속 이름·학번은 모두 가상입니다.</footer>
</main>
<script>
const CH = [[0, '오프닝'], [15.2, '도입 배경'], [39.5, '서비스 4종'], [96.7, '서비스 연계'], [131.6, '운영 성과'], [162.2, '운영 보완·개인정보'], [187.7, '엔딩']];
const v = document.getElementById('v'), nav = document.getElementById('ch');
const mmss = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
CH.forEach(([t, n]) => {
  const b = document.createElement('button');
  b.innerHTML = `<span>${mmss(t)}</span>${n}`;
  b.onclick = () => { v.currentTime = t; v.play(); };
  nav.appendChild(b);
});
v.addEventListener('timeupdate', () => {
  let cur = 0; CH.forEach(([t], i) => { if (v.currentTime >= t - 0.2) cur = i; });
  [...nav.children].forEach((b, i) => b.setAttribute('aria-current', i === cur));
});
</script>
</body>
</html>
